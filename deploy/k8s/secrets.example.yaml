# Not applied by the kustomization: create the real one with values of your own,
#
#   kubectl -n managed-agent create secret generic managed-agent \
#     --from-literal=egress-proxy-secret="$(openssl rand -base64 48)" \
#     --from-literal=encryption-keys="v1=$(openssl rand -base64 32)" \
#     --from-literal=bootstrap-token="$(openssl rand -base64 32)"
#
# The control plane and the egress proxy must share egress-proxy-secret.
apiVersion: v1
kind: Secret
metadata:
  name: managed-agent
  namespace: managed-agent
type: Opaque
stringData:
  egress-proxy-secret: REPLACE-with-48-random-bytes-base64
  encryption-keys: v1=REPLACE-with-32-random-bytes-base64
  bootstrap-token: REPLACE-with-32-random-bytes-base64
