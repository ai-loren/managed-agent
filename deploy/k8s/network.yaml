# What a restricted sandbox's NetworkPolicy lets it reach, by the pods' labels.
#
# By labels, not addresses: a NetworkPolicy is enforced after a Service's
# address is translated to a pod's, so a Service ClusterIP in a policy matches
# nothing — the sandbox could not reach its control plane at all. The CIDR
# settings (MA_CONTROL_PLANE_CIDR, MA_EGRESS_PROXY_CIDR, MA_DNS_CIDR) are for a
# control plane, proxy or resolver outside the cluster. DNS needs no setting:
# the cluster's resolver in kube-system is permitted by default.
#
# Narrow is the point: each is a hole in every restricted sandbox's fence.
apiVersion: v1
kind: ConfigMap
metadata:
  name: managed-agent-network
  namespace: managed-agent
data:
  # The control-plane pods ([namespace:]key=value): the one destination a
  # restricted sandbox may call (bootstrap, events, model calls), and the only
  # source its agent-core accepts.
  MA_CONTROL_PLANE_PODS: "app=managed-agent"
  # The egress proxy's pods, for an allowlist's fence.
  MA_EGRESS_PROXY_PODS: "app=ma-egress"
