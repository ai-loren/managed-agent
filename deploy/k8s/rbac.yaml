# The control plane's identity: exactly what the k8s driver calls, in its own
# namespace, and nothing cluster-wide. pods/log is how it reads a sandbox's
# startup failure and the NetworkPolicy probe's verdict.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: managed-agent
  namespace: managed-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: managed-agent-sandboxes
  namespace: managed-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: managed-agent-sandboxes
  namespace: managed-agent
subjects:
  - kind: ServiceAccount
    name: managed-agent
    namespace: managed-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: managed-agent-sandboxes
