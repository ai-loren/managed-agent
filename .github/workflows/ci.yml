name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager"; specifying it here
      # too makes the action fail on the mismatch.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 is a hard requirement, not a hint: we rely on unflagged
          # TypeScript execution (23.6+), node:test and node:sqlite.
          node-version: 24.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  docker-e2e:
    # Tests that build images and run real containers (and a k3s cluster in
    # Docker). They skip in `pnpm test`, which must stay fast and self-contained;
    # MA_E2E_DOCKER=1 turns them on here, with the time they need. The unit suite
    # on Postgres is most of the time, so it is spread over three runners while a
    # fourth runs everything else.
    name: docker-e2e (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [containers, postgres 1/3, postgres 2/3, postgres 3/3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Docker e2e
        env:
          MA_E2E_DOCKER: '1'
          PART: ${{ matrix.part }}
        run: |
          if [ "$PART" = containers ]; then
            files=$(find packages apps -path '*/node_modules' -prune -o -path '*/test/*' -name '*.docker.test.ts' ! -name 'postgres.docker.test.ts' -print | sort)
            node --test --test-timeout=900000 $files
          else
            MA_PG_SUITE_SHARD="${PART#postgres }" node --test --test-timeout=900000 apps/server/test/postgres.docker.test.ts
          fi

  load-smoke:
    # The load test's small profile: it fails on any error or a latency an order
    # of magnitude past what it should be, not on a slow runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm load --profile smoke

  commit-hygiene:
    # Authorship must stay with the human who reviewed the change; AI tools are
    # credited with Assisted-By, never Co-Authored-By.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject AI co-author trailers
        run: |
          range="origin/${{ github.base_ref }}..HEAD"
          if git log "$range" --format='%(trailers:key=Co-Authored-By)' \
              | grep -Ei 'claude|copilot|cursor|chatgpt|agent|bot' ; then
            echo "::error::Use 'Assisted-By:' for AI assistance, not 'Co-Authored-By:'."
            exit 1
          fi
          echo "commit trailers OK"
